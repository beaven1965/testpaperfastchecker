<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TestPaper FastChecker</title>
<meta name="description" content="Check test papers with your phone camera. Scores, MPS and item analysis in minutes.">
<meta name="theme-color" content="#1F2A44">
<link rel="manifest" href="/app/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, three big tiles per test. Paper-blue ground, red-ballpen accent. */
:root{
  --bg:#EEF2F6; --card:#FFFFFF; --ink:#1C2230; --muted:#5B6577; --line:#D5DCE6;
  --navy:#1F2A44; --navy-ink:#FFFFFF; --red:#C8102E; --green:#18794E; --amber:#A35400; --hi:#FFE45C;
  --soft-red:#FBE7EA; --soft-green:#E3F3EA; --soft-amber:#FFF1DE;
  --f-body:'Atkinson Hyperlegible', system-ui, sans-serif; --f-disp:'Young Serif', Georgia, serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#12161F; --card:#1B2130; --ink:#E8ECF3; --muted:#9AA4B5; --line:#2C3446;
  --navy:#3A4E86; --navy-ink:#FFFFFF; --red:#FF5A6E; --green:#4CC38A; --amber:#F0A24A; --hi:#FFE45C;
  --soft-red:#3A1E25; --soft-green:#173226; --soft-amber:#3A2A15; color-scheme:dark; } }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-block:8px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1{font-family:var(--f-disp);font-weight:400;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:18px;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:6px}
.brand{background:none;border:0;padding:6px 0;font-family:var(--f-disp);font-size:19px;line-height:1.1;text-align:left;display:flex;align-items:center;gap:8px}
.brand i{font-style:normal;color:var(--red);font-size:26px;line-height:1}
.hdr-r{display:flex;align-items:center;gap:6px}
.gear{background:none;border:0;font-size:22px;padding:6px;color:var(--muted)}
.foot a,.card a{color:inherit;font-weight:700}
.pill{white-space:nowrap;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.pill.low{border-color:var(--red);color:var(--red)}
.pill.paid{border-color:var(--green);color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:0;border-radius:14px;background:var(--navy);color:var(--navy-ink);font-weight:700;font-size:18px;text-decoration:none;padding:12px 16px;text-align:center}
.big.red{background:var(--red);color:#fff}
.ghost{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);font-weight:700}
.link{background:none;border:0;color:var(--red);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;align-self:flex-start}
.hook h1{font-size:34px}
.hook mark{background:none;color:var(--red);padding:0;text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:.09em;text-underline-offset:.14em}
.steps{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;border:2px solid var(--red);color:var(--red);display:grid;place-items:center;font-weight:700}
.steps b{display:block}
.free{font-size:14px;color:var(--green);font-weight:700;text-align:center}
.tests{display:flex;flex-direction:column;gap:10px}
.test{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.test b{font-size:18px}
.test .mps{grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right;font-variant-numeric:tabular-nums}
.test .mps strong{display:block;font-family:var(--f-disp);font-weight:400;font-size:24px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--soft-amber);color:var(--amber);margin-left:6px;vertical-align:2px}
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{display:grid;grid-template-columns:46px 1fr;gap:2px 14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.tile .n{grid-row:1 / span 2;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--bg)}
.tile b{font-size:19px}
.tile small{color:var(--muted);font-size:14px}
.tile.main{border-color:var(--navy);background:var(--navy);color:var(--navy-ink)}
.tile.main small{color:var(--navy-ink);opacity:.85}
.tile.main .n{background:rgba(255,255,255,.14)}
label.lbl{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:12px;font-size:17px;min-height:50px}
textarea{min-height:140px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kgrid{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.krow{display:grid;grid-template-columns:36px repeat(5,1fr);gap:6px;align-items:center}
.krow span{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.kb{height:42px;border-radius:50%;aspect-ratio:1;justify-self:center;border:2px solid var(--line);background:var(--card);font-weight:700}
.kb.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hide{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tips{margin:0;padding-left:20px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:4px}
.score{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.score strong{font-family:var(--f-disp);font-weight:400;font-size:56px;line-height:1;color:var(--red)}
.who{display:flex;flex-direction:column;gap:6px}
.who b{font-size:20px}
.warn{background:var(--soft-amber);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700}
.bad{background:var(--soft-red);color:var(--red);border-radius:10px;padding:12px;font-size:15px}
.ok{background:var(--soft-green);color:var(--green);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700}
.flag{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.flag span{flex:1 1 140px;font-size:15px}
.flag button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:700}
.overlay{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-variant-numeric:tabular-nums}
.stat strong{display:block;font-family:var(--f-disp);font-weight:400;font-size:28px}
.stat.mps{grid-column:1 / -1}
.stat.mps strong{font-size:46px;color:var(--red)}
.stat small{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}
.chip.m{background:var(--soft-green);color:var(--green)}
.chip.n{background:var(--soft-amber);color:var(--amber)}
.chip.l{background:var(--soft-red);color:var(--red)}
.reteach{display:flex;flex-wrap:wrap;gap:6px}
.x{background:none;border:0;color:var(--muted);font-size:18px;padding:2px 6px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gtable td,.gtable th{padding:7px 8px;font-size:14px}
.gtable .sticky{position:sticky;left:0;background:var(--card);z-index:1;max-width:170px;white-space:normal;min-width:150px}
.gtable .pcol{background:var(--bg);font-weight:700}
.gtable .qg{font-weight:700;font-size:16px}
.gtable .qg.low{color:var(--red)}
.gin{width:58px;min-height:36px!important;padding:4px 6px!important;font-size:15px!important;text-align:right;border-radius:8px!important}
.miss{color:var(--amber);font-weight:700}
.meter{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.mbar{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--green);border-radius:6px}
.plan{border:2px solid var(--navy);border-radius:16px;padding:18px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.promo{align-self:flex-start;background:var(--hi);color:#1C2230;font-weight:700;font-size:14px;border-radius:999px;padding:3px 12px}
.promo s{opacity:.7}
.lead1{margin:0 0 10px}
.pr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.pt{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.pt.on{border-color:var(--hi)} .pt.off{opacity:.5} .pt.off strong{text-decoration:line-through}
.pt small{font-size:14px;font-weight:700} .pt strong{font-family:var(--f-disp);font-weight:400;font-size:36px;line-height:1.1} .pt span{font-size:14px;color:var(--muted)}
.plan .price{font-family:var(--f-disp);font-size:42px;line-height:1}
.plan .price small{font-family:var(--f-body);font-size:16px;color:var(--muted)}
.plan ul{margin:0;padding-left:20px}
.ostep{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.ostep > i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700}
.ostep > div{display:flex;flex-direction:column;gap:8px;min-width:0}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--f-body);font-weight:700;font-size:18px;background:var(--bg);border-radius:8px;padding:6px 10px;word-break:break-all}
.copy{border:1.5px solid var(--navy);color:var(--ink);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.inline button:not(.ghost){flex:none;border:0;border-radius:12px;background:var(--navy);color:var(--navy-ink);font-weight:700;padding:0 16px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.busy{display:flex;align-items:center;gap:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
details summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 0}
.keyline{font-family:ui-monospace,monospace;font-size:15px;word-break:break-all;letter-spacing:.06em}
.foot{text-align:center;color:var(--muted);font-size:13px}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// =====================================================================
//  SETTINGS FOR BEAVEN — change these lines only.
// =====================================================================
const CONFIG = {
  appName: 'TestPaper FastChecker',
  freePapers: 50,                        // free checked papers per phone
  promoPrice: '₱99',                     // launch promo price of one load
  regularPrice: '₱149',                  // regular price of one load
  promoUntil: '2026-12-31',              // last day of the promo. After this day the app shows the regular price by itself.
  loadPapers: 300,                       // papers in one load
  loadDays: 60,                          // a load ends after this many days, or when the papers run out — whichever comes first
  contactEmail: 'testpaperfastchecker@gmail.com',   // TODO: the app's own Gmail
  messenger: 'facebook.com/BeavsApp',    // TODO: your Facebook Page
  // Load codes are checked by your ScitechLectureTool server (same SE- codes from /admin/).
  // Add this app's web address to the CORS list at the top of verify-code.js.
  business: 'Beavs Apps',                // shown at the bottom of every screen
  inviteNeed: 2,                         // teachers who must buy a first load for the inviter to get 1 free load
  verifyUrl: 'https://scitechlecturetool.netlify.app/.netlify/functions/verify-code',
  mastered: 75, nearly: 50               // item analysis cut-offs, in percent
};
const PROMO_ON = new Date() <= new Date(CONFIG.promoUntil + 'T23:59:59+08:00');
CONFIG.price = PROMO_ON ? CONFIG.promoPrice : CONFIG.regularPrice;
const longDate = d => d.toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
const PROMO_END = longDate(new Date(CONFIG.promoUntil + 'T12:00:00+08:00'));
const REGULAR_FROM = longDate(new Date(new Date(CONFIG.promoUntil + 'T12:00:00+08:00').getTime() + 864e5));
// =====================================================================

/*READER-START*/
// The paper reader. Sheet coordinates are millimetres, measured from the centre of the top-left black square.
const LAY = { W:180, H:250, mk:10, guard:[0,14], bitY:44, bitX0:42, bitStep:9, bitS:5,
  rowY0:62, rowStep:9, colX:[8,68,128], bub0:12, bubStep:9, bubR:2.8 };
function itemXY(i, j){ const c = Math.floor(i / 20), r = i % 20; return [LAY.colX[c] + LAY.bub0 + j * LAY.bubStep, LAY.rowY0 + r * LAY.rowStep]; }
function bitXY(k){ return [LAY.bitX0 + k * LAY.bitStep, LAY.bitY]; }
function solveLin(A, b){
  const n = b.length, M = A.map((r, i) => r.concat(b[i]));
  for(let c = 0; c < n; c++){
    let p = c; for(let r = c + 1; r < n; r++) if(Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    const v = M[c][c]; if(Math.abs(v) < 1e-12) return null;
    for(let r = 0; r < n; r++){ if(r === c) continue; const f = M[r][c] / v; if(!f) continue; for(let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
  }
  return M.map((r, i) => r[n] / r[i]);
}
function homog(src, dst){
  const A = [], b = [];
  for(let i = 0; i < 4; i++){ const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v); }
  const h = solveLin(A, b); return h ? h.concat(1) : null;
}
function mapH(H, x, y){ const z = H[6] * x + H[7] * y + 1; return [(H[0] * x + H[1] * y + H[2]) / z, (H[3] * x + H[4] * y + H[5]) / z]; }
// img = { g: grey pixels (0–255), w, h }. Returns the answers, or { error }.
function readGray(img, n, opts){
  const { g, w, h } = img, M = Math.max(w, h), W1 = w + 1;
  const I = new Float64Array(W1 * (h + 1));
  for(let y = 0; y < h; y++){ let row = 0; for(let x = 0; x < w; x++){ row += g[y * w + x]; I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + row; } }
  const box = (x0, y0, x1, y1) => { x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0)); x1 = Math.min(w, Math.floor(x1)); y1 = Math.min(h, Math.floor(y1));
    const a = (x1 - x0) * (y1 - y0); if(a <= 0) return 255; return (I[y1 * W1 + x1] - I[y0 * W1 + x1] - I[y1 * W1 + x0] + I[y0 * W1 + x0]) / a; };
  // 1. dark spots, compared with the paper around them (so shadows don't fool it)
  const R = Math.round(M / 16), mask = new Uint8Array(w * h);
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){ if(g[y * w + x] < box(x - R, y - R, x + R + 1, y + R + 1) * 0.6) mask[y * w + x] = 1; }
  // 2. group the dark spots
  const lab = new Int32Array(w * h), st = new Int32Array(w * h), comps = [];
  for(let p = 0; p < w * h; p++){
    if(!mask[p] || lab[p]) continue;
    const id = comps.length + 1; let sp = 0; st[sp++] = p; lab[p] = id;
    let cnt = 0, sx = 0, sy = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
    while(sp){ const q = st[--sp], x = q % w, y = (q / w) | 0; cnt++; sx += x; sy += y;
      if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y;
      if(x > 0 && mask[q - 1] && !lab[q - 1]){ lab[q - 1] = id; st[sp++] = q - 1; }
      if(x < w - 1 && mask[q + 1] && !lab[q + 1]){ lab[q + 1] = id; st[sp++] = q + 1; }
      if(y > 0 && mask[q - w] && !lab[q - w]){ lab[q - w] = id; st[sp++] = q - w; }
      if(y < h - 1 && mask[q + w] && !lab[q + w]){ lab[q + w] = id; st[sp++] = q + w; } }
    comps.push({ n: cnt, cx: sx / cnt, cy: sy / cnt, x0, x1, y0, y1 });
  }
  // 3. the four big black corner squares
  const cand = [];
  for(const c of comps){ const bw = c.x1 - c.x0 + 1, bh = c.y1 - c.y0 + 1, sz = Math.sqrt(bw * bh);
    if(sz < 0.012 * M || sz > 0.12 * M) continue; const ar = bw / bh; if(ar < 0.55 || ar > 1.8) continue;
    if(c.n / (bw * bh) < 0.6) continue; c.sz = sz; cand.push(c); }
  if(cand.length < 4) return { error: 'corners' };
  const ss = cand.map(c => c.sz).sort((a, b) => b - a), ref = (ss[1] + ss[2]) / 2;
  const big = cand.filter(c => c.sz >= 0.72 * ref && c.sz <= 1.5 * ref);
  if(big.length < 4) return { error: 'corners' };
  const pick = f => big.reduce((a, c) => f(c) < f(a) ? c : a);
  const tl = pick(c => c.cx + c.cy), tr = pick(c => (w - c.cx) + c.cy), br = pick(c => -(c.cx + c.cy)), bl = pick(c => c.cx + (h - c.cy));
  if(new Set([tl, tr, br, bl]).size < 4) return { error: 'corners' };
  const corners = [[tl.cx, tl.cy], [tr.cx, tr.cy], [br.cx, br.cy], [bl.cx, bl.cy]];
  const sheet = [[0, 0], [LAY.W, 0], [LAY.W, LAY.H], [0, LAY.H]];
  const R2 = Math.round(M / 10);
  const disc = (H, x, y, rmm) => { const [cx, cy] = mapH(H, x, y), [ax, ay] = mapH(H, x + 1, y);
    const r = Math.max(1.5, rmm * Math.hypot(ax - cx, ay - cy)), r2 = r * r; let sum = 0, c = 0;
    for(let yy = Math.floor(cy - r); yy <= cy + r; yy++) for(let xx = Math.floor(cx - r); xx <= cx + r; xx++){
      if(xx < 0 || yy < 0 || xx >= w || yy >= h) continue; if((xx - cx) ** 2 + (yy - cy) ** 2 > r2) continue; sum += g[yy * w + xx]; c++; }
    return (c ? sum / c : 255) / Math.max(1, box(cx - R2, cy - R2, cx + R2, cy + R2)); };
  // 4. which way up? the small guard square sits under the top-left corner
  let best = null;
  for(let k = 0; k < 4; k++){ const H = homog(sheet, [0, 1, 2, 3].map(i => corners[(i + k) % 4])); if(!H) continue;
    const sc = disc(H, LAY.W, LAY.guard[1], 1.5) - disc(H, LAY.guard[0], LAY.guard[1], 1.5);
    if(!best || sc > best.sc) best = { H, sc }; }
  if(!best || best.sc < 0.25) return { error: 'corners' };
  const H = best.H;
  // 5. read the circles
  const black = [[0, 0], [LAY.W, 0], [0, LAY.H], [LAY.W, LAY.H]].map(p => disc(H, p[0], p[1], 2.5)).reduce((a, b) => a + b) / 4;
  const raw = [], all = [];
  for(let i = 0; i < n; i++){ const row = []; for(let j = 0; j < opts; j++){ const [x, y] = itemXY(i, j); const v = disc(H, x, y, LAY.bubR * 0.55); row.push(v); all.push(v); } raw.push(row); }
  const sorted = all.slice().sort((a, b) => a - b), blank = sorted[Math.floor(sorted.length * 0.7)];
  if(blank - black < 0.2) return { error: 'dark' };
  const S = v => Math.max(0, Math.min(1.5, (blank - v) / (blank - black)));
  const ans = [], flags = [], marks = [];
  for(let i = 0; i < n; i++){ const s = raw[i].map(S); marks.push(s);
    const order = s.map((v, j) => j).sort((a, b) => s[b] - s[a]), top = s[order[0]], sec = s[order[1]];
    if(top < 0.35){ ans.push(null); flags.push({ i, why: 'blank' }); }
    else if(sec >= 0.35 && top - sec < 0.25){ ans.push(null); flags.push({ i, why: 'two' }); }
    else ans.push(order[0]); }
  let learner = 0, code = 0;
  for(let k = 0; k < 12; k++){ const [x, y] = bitXY(k); if(S(disc(H, x, y, 1.2)) > 0.5){ if(k < 7) learner |= 1 << k; else code |= 1 << (k - 7); } }
  return { H, ans, flags, marks, learner, code };
}

  if(!d || !/^d-[a-z0-9]{12,40}$/.test(d)){ const a = new Uint8Array(12); crypto.getRandomValues(a); d = 'd-' + Array.from(a, b => b.toString(36).padStart(2, '0')).join('').slice(0, 24); try{ localStorage.setItem('st_device', d); }catch(e){} }

const getTest = id => S.tests.find(t => t.id === id);
// Like cellphone load: free papers first, then each load code (the one ending soonest is used first).
function activeLoads(){ const now = Date.now(); return (S.codes || []).filter(c => typeof c.exp === 'number' && c.exp > now && (c.used || 0) < c.papers).sort((a, b) => a.exp - b.exp); }
function loadLeft(){ return activeLoads().reduce((a, c) => a + c.papers - (c.used || 0), 0); }
function loadEnds(){ const a = activeLoads(); return a.length ? Math.max(...a.map(c => c.exp)) : 0; }
function freeLeft(){ return Math.max(0, CONFIG.freePapers - (S.used || 0)); }
function papersLeft(){ return freeLeft() + loadLeft(); }

function spendOne(){ if(freeLeft() > 0){ S.used = (S.used || 0) + 1; return; } const c = activeLoads()[0]; if(c) c.used = (c.used || 0) + 1; }
const daysLeft = ms => Math.max(0, Math.ceil((ms - Date.now()) / 864e5));

// ---------- scores ----------
function scoreOf(t, ans){ let s = 0; for(let i = 0; i < t.n; i++) if(ans[i] != null && ans[i] === t.key[i]) s++; return s; }
function stats(t){
  const cls = getClass(t.classId), res = Object.entries(t.results || {});
  const scores = res.map(([, r]) => r.score);
  const mean = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
  const sd = scores.length > 1 ? Math.sqrt(scores.reduce((a, b) => a + (b - mean) ** 2, 0) / (scores.length - 1)) : 0;
  const items = [];
  for(let i = 0; i < t.n; i++){ let ok = 0; const wrong = {}; res.forEach(([, r]) => { const a = r.ans[i]; if(a === t.key[i]) ok++; else { const k = a == null ? '—' : LET[a]; wrong[k] = (wrong[k] || 0) + 1; } });
    const pct = res.length ? ok / res.length * 100 : 0; const top = Object.entries(wrong).sort((a, b) => b[1] - a[1])[0];
    items.push({ i, ok, pct, top: top ? top[0] + ' (' + top[1] + ')' : '', lvl: pct >= CONFIG.mastered ? 'm' : pct >= CONFIG.nearly ? 'n' : 'l' }); }
  return { done: res.length, total: cls ? cls.learners.length : 0, mean, sd, mps: t.n ? mean / t.n * 100 : 0,
    hi: scores.length ? Math.max(...scores) : 0, lo: scores.length ? Math.min(...scores) : 0, items };
}

  do15t: { label: 'EPP/TLE, MAPEH · 20 / 60 / 20 (DO 015, s. 2026)', w: [20, 60, 20] },
  lang:  { label: 'Languages, AP, EsP · 30 / 50 / 20 (DO 8, s. 2015)', w: [30, 50, 20] },
  ms:    { label: 'Math, Science · 40 / 40 / 20 (DO 8, s. 2015)', w: [40, 40, 20] },
  shs:   { label: 'SHS core · 25 / 50 / 25 (DO 8, s. 2015)', w: [25, 50, 25] },
  custom:{ label: 'Custom', w: null } };
// Initial Grade 70 = 75 (SY 2026–2027 adjusted table) or Initial Grade 60 = 75 (DO 8, s. 2015)
function tmAdj(ig){ ig = Math.round(ig * 100) / 100; if(ig >= 99.5) return 100; if(ig >= 70) return Math.min(99, 75 + Math.floor((ig - 70) / 1.18 + 1e-9));
  let k = 0; for(let j = 1; j <= 14; j++){ if(ig >= Math.round(70 * j / 15 * 100) / 100 + 0.01 - 1e-9) k = j; } return 60 + k; }
function tmDo8(ig){ ig = Math.round(ig * 100) / 100; if(ig >= 100) return 100; if(ig >= 60) return Math.min(99, 75 + Math.floor((ig - 60) / 1.6 + 1e-9)); return 60 + Math.floor(ig / 4 + 1e-9); }
const lrnCell = (c, i) => (c.lrn && c.lrn[i]) ? '="' + c.lrn[i] + '"' : '';
function gradeSetup(c){ if(!c.grade) c.grade = { preset: 'do15', w: [20, 50, 30], tm: 'adj' }; return c.grade; }
function gradeCols(c, q){
  const cols = [];
  S.tests.filter(t => t.classId === c.id && (t.term || 1) === q).forEach(t => cols.push({ key: 't' + t.id, title: t.title, part: t.part || 'WW', hps: t.n, get: i => t.results[i + 1] ? t.results[i + 1].score : null }));
  (c.extra || []).filter(x => x.term === q).forEach(x => cols.push({ key: 'x' + x.id, x, title: x.title, part: x.part, hps: x.hps, get: i => { const v = x.scores[i + 1]; return v === '' || v == null || isNaN(+v) ? null : +v; } }));
  return ['WW', 'PT', 'QA'].map(p => cols.filter(k => k.part === p));
}
function gradeRow(c, q, i, groups){
  const g = gradeSetup(c), out = { parts: [], missing: 0 }; let ig = 0, complete = true;
  groups.forEach((cols, p) => { let sS = 0, sH = 0; cols.forEach(k => { const v = k.get(i); if(v == null) out.missing++; sS += v || 0; sH += k.hps; });
    const ps = sH ? sS / sH * 100 : null, ws = ps == null ? null : ps * g.w[p] / 100; if(ps == null) complete = false; else ig += ws;
    out.parts.push({ total: sS, ps, ws }); });
  out.ig = complete ? ig : null; out.qg = complete ? (g.tm === 'do8' ? tmDo8(ig) : tmAdj(ig)) : null; return out;
}

    ${g.preset === 'custom' ? `<div class="row3">${['WW', 'PT', 'QA'].map((p, k) => `<label class="lbl">${p} %<input type="number" id="g-c${k}" value="${g.w[k]}" inputmode="numeric"></label>`).join('')}</div>` : ''}

  ${V.adding ? `<div class="card" style="display:flex;flex-direction:column;gap:10px"><b>New score column</b>
      <label class="lbl">Name<input type="text" id="x-title" placeholder="e.g. PT 1 – Science fair poster"></label>
      <div class="row2"><label class="lbl">Counts as<select id="x-part">${Object.entries(PARTS).map(([k, v]) => `<option value="${k}" ${k === 'PT' ? 'selected' : ''}>${v}</option>`).join('')}</select></label>

      <div class="inline"><button class="ghost" data-act="addcolcancel">Cancel</button><button class="big" data-act="addcolsave" style="flex:1">Add column</button></div></div>`
    : `<button class="ghost" data-act="addcol">+ Add a score column (performance task, recitation…)</button>`}
  <div class="tbl"><table class="gtable"><thead><tr><th class="sticky">Learner</th>${head}<th class="num">Initial</th><th class="num">Quarterly grade</th></tr></thead><tbody>${rows}</tbody></table></div>

function refreshGradeRow(i){ const c = getClass(V.cid), q = V.term, groups = gradeCols(c, q), r = gradeRow(c, q, i, groups);
  r.parts.forEach((p, k) => { const el = $('#g' + i + 'p' + k); if(el) el.textContent = p.ps == null ? '' : p.ps.toFixed(2); });
  $('#g' + i + 'ig').textContent = r.ig == null ? '' : r.ig.toFixed(2); const qg = $('#g' + i + 'qg'); qg.textContent = r.qg ?? '—'; qg.classList.toggle('low', r.qg != null && r.qg < 75); }
function csvGrades(){
  const c = getClass(V.cid), q = V.term, g = gradeSetup(c), groups = gradeCols(c, q);
  const head = ['No.', 'LRN', 'Learner']; groups.forEach((cols, p) => { cols.forEach(k => head.push(k.title + ' (/' + k.hps + ')')); const P = ['WW', 'PT', 'QA'][p]; head.push(P + ' total', P + ' PS', P + ' WS (' + g.w[p] + '%)'); }); head.push('Initial grade', 'Quarterly grade');
  const rows = c.learners.map((n, i) => { const r = gradeRow(c, q, i, groups), row = [i + 1, lrnCell(c, i), n];
    groups.forEach((cols, p) => { cols.forEach(k => row.push(k.get(i) ?? '')); const P = r.parts[p]; row.push(P.total, P.ps == null ? '' : P.ps.toFixed(2), P.ws == null ? '' : P.ws.toFixed(2)); });
    row.push(r.ig == null ? '' : r.ig.toFixed(2), r.qg ?? ''); return row; });
  downloadCsv(c.name + ' Q' + q + ' grades', [['Class', c.name], ['Quarter', q], ['Weights WW/PT/QA', g.w.join(' / ')], [], head].concat(rows));
}

function saveTest(){
  const d = V.d, err = $('#ferr'); const fail = m => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: 'center' }); };
  if(!d.title.trim()) return fail('Please type a test name.');
  let classId = d.classId;
  if(!V.edit && classId === 'new'){
    const rows = parseNames(d.names), names = rows.map(r => r.name);
    if(!d.cname.trim()) return fail('Please type the class name.');
    if(!names.length) return fail('Please paste the learners\' names.');
    if(names.length > 127) return fail('A class can have up to 127 learners.');
    const c = { id: uid(), name: d.cname.trim(), learners: names, lrn: rows.map(r => r.lrn) }; S.classes.push(c); classId = c.id; }
  const missing = []; for(let i = 0; i < d.n; i++) if(d.key[i] == null || d.key[i] >= d.opts) missing.push(i + 1);
  if(missing.length) return fail('The answer key is missing: No. ' + missing.slice(0, 10).join(', ') + (missing.length > 10 ? '…' : ''));
  if(V.edit){ const t = getTest(V.edit); Object.assign(t, { title: d.title.trim(), term: d.term, part: d.part, n: d.n, opts: d.opts, key: d.key.slice(0, d.n) });
    Object.values(t.results).forEach(r => r.score = scoreOf(t, r.ans)); save(); toast('Saved. Scores updated with the new key.'); go('test', { id: t.id }, true); }
  else { S.lastTerm = d.term; const t = { id: uid(), title: d.title.trim(), classId, term: d.term, part: d.part, n: d.n, opts: d.opts, key: d.key.slice(0, d.n), code: 1 + Math.floor(Math.random() * 31), results: {}, at: Date.now() };
    S.tests.push(t); save(); go('test', { id: t.id }, true); toast('Test saved. Next: print the answer sheets.'); }
}

function parseNames(text){
  return text.split('\n').map(s => s.trim()).filter(s => s && !/^-+$/.test(s)).map(line => {
    const m = line.match(/^(\d{12})[\s,;]+(.+)$/); return m ? { lrn: m[1], name: m[2].trim() } : { lrn: '', name: line }; });
}
function loadScript(src){ return new Promise((res, rej) => { if(window.XLSX) return res(); const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
async function importSF1(file){
  // Reads the SF1 (LRN + names) or the SF2 / any class list with a NAME column (names only).
  const ta = $('#f-names'), err = $('#ferr'); err.hidden = true;
  try{
    await loadScript('/app/xlsx.full.min.js');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    let found = null;
    for(const sn of wb.SheetNames){
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: '' });
      let hr = -1, cL = -1, cN = -1, cS = -1;
      for(let r = 0; r < Math.min(rows.length, 40) && hr < 0; r++){
        rows[r].forEach((v, c) => { const t = String(v).replace(/\s+/g, ' ').trim().toUpperCase();
          if(t === 'LRN') cL = c; if(cN < 0 && /^NAME ?(\(|$)/.test(t)) cN = c; if(/^SEX/.test(t) || t === '(M/F)') cS = c; });
        if(cN >= 0) hr = r; }
      if(hr < 0) continue;
      const list = []; let girlsNow = false, sawMarker = false;
      for(let r = hr + 1; r < rows.length; r++){
        const line = rows[r].map(v => String(v).toUpperCase()).join(' ');
        if(/TOTAL/.test(line) && /\bMALE\b/.test(line) && !/FEMALE/.test(line)){ girlsNow = true; sawMarker = true; continue; }
        if(/TOTAL/.test(line) && /FEMALE/.test(line)) break;
        const name = String(rows[r][cN]).replace(/\s+/g, ' ').trim();
        if(!name || /TOTAL/i.test(name)) continue;
        if(cL >= 0){
          const lrn = String(rows[r][cL]).replace(/\D/g, '');
          if(lrn.length !== 12) continue;
          let sex = cS >= 0 ? String(rows[r][cS]).trim().toUpperCase()[0] : '';
          if(!sex){ for(let c = cN + 1; c < cN + 4; c++){ const v = String(rows[r][c] || '').trim().toUpperCase(); if(v === 'M' || v === 'F'){ sex = v; break; } } }
          list.push({ lrn, name, sex });
        } else {
          if(!/,/.test(name) || !/[A-Za-zÑñ]/.test(name)) continue;   // a real name: "FAMILY, Given"
          list.push({ lrn: '', name, sex: girlsNow ? 'F' : (sawMarker ? 'M' : '') });
        }
      }
      if(sawMarker) list.forEach(x => { if(!x.sex) x.sex = 'M'; });
      if(list.length){ found = { list, hasLrn: cL >= 0 }; break; }
    }
    if(!found){ err.textContent = 'No learners\' names were found in this file. Use the SF1 or SF2 Excel file, or paste the names.'; err.hidden = false; return; }
    let out = found.list, msg;
    if(found.hasLrn){
      const by = (a, b) => a.name.localeCompare(b.name);
      const boys = out.filter(x => x.sex !== 'F').sort(by), girls = out.filter(x => x.sex === 'F').sort(by);
      out = boys.concat(girls); msg = `· ${boys.length} boys, ${girls.length} girls loaded, with LRN`;
    } else {
      const boys = out.filter(x => x.sex === 'M').length, girls = out.filter(x => x.sex === 'F').length;
      msg = boys || girls ? `· ${boys} boys, ${girls} girls loaded (this file has no LRN)` : `· ${out.length} learners loaded (this file has no LRN)`;
    }
    V.d.names = out.map(x => (x.lrn ? x.lrn + '  ' : '') + x.name).join('\n'); ta.value = V.d.names;
    $('#ncount').textContent = msg;
    toast(`${out.length} learners loaded. Please check the spelling.`);
  }catch(e){ err.textContent = 'This file could not be read. Save it as .xlsx and try again, or paste the names.'; err.hidden = false; }
}

// ---------- reading a photo ----------
async function readPaper(file){
  const t = getTest(V.id); V.busy = true; V.err = null; V.res = null; V.pick = false; render();
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, 1500 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
    const px = cx.getImageData(0, 0, w, h).data, g = new Uint8Array(w * h);
    for(let i = 0, p = 0; i < g.length; i++, p += 4) g[i] = (px[p] * 299 + px[p + 1] * 587 + px[p + 2] * 114) / 1000;
    await new Promise(r => setTimeout(r, 30));
    const r = readGray({ g, w, h }, t.n, t.opts);
    V.busy = false;
    if(r.error){ V.err = r.error === 'dark' ? 'The photo is too dark or blurry.' : 'The 4 black corner squares were not found.'; render(); return; }
    r.wrongTest = r.code !== t.code;
    if(r.learner > getClass(t.classId).learners.length) r.learner = 0;
    r.overlay = drawOverlay(cv, r, t);
    V.res = r; render();
  }catch(e){ V.busy = false; V.err = 'That photo could not be opened. Please take it again.'; render(); }
}
function drawOverlay(cv, r, t){
  const k = Math.min(1, 900 / cv.width), o = document.createElement('canvas'); o.width = cv.width * k; o.height = cv.height * k;
  const c = o.getContext('2d'); c.drawImage(cv, 0, 0, o.width, o.height); c.lineWidth = Math.max(2, o.width / 300);
  const flagged = new Set(r.flags.map(f => f.i));
  for(let i = 0; i < t.n; i++){
    const ring = (j, col) => { const [x, y] = itemXY(i, j), [px, py] = mapH(r.H, x, y), [qx, qy] = mapH(r.H, x + LAY.bubR + 1, y); c.strokeStyle = col; c.beginPath(); c.arc(px * k, py * k, Math.hypot(qx - px, qy - py) * k, 0, 7); c.stroke(); };
    if(flagged.has(i)) ring(t.key[i], '#F08C00');
    else { ring(t.key[i], '#18A058'); if(r.ans[i] !== t.key[i] && r.ans[i] != null) ring(r.ans[i], '#E0182D'); }
  }
  return o.toDataURL('image/jpeg', 0.75);
}
function savePaper(){
  const t = getTest(V.id), r = V.res, L = getClass(t.classId).learners;
  if(!(r.learner > 0 && r.learner <= L.length)){ toast('Choose the learner first.'); V.pick = true; render(); return; }
  const isNew = !t.results[r.learner];
  if(isNew && !canCheck()){ go('load'); return; }
  const score = scoreOf(t, r.ans);
  t.results[r.learner] = { ans: r.ans.slice(), score, at: Date.now() };
  if(isNew) spendOne();
  save();
  V.last = L[r.learner - 1] + ' · ' + score + '/' + t.n; V.res = null; V.pick = false;
  render(); toast('Saved ✓');
}

// ---------- printing ----------
function sheetSVG(t, cls, no){
  const name = no ? cls.learners[no - 1] : '';
  const T = (x, y, s, txt, extra = '') => `<text x="${x}" y="${y}" font-size="${s}" ${extra}>${esc(txt)}</text>`;
  let s = `<svg class="sheet" xmlns="http://www.w3.org/2000/svg" viewBox="-7 -6 194 262" width="194mm" height="262mm" font-family="Arial, Helvetica, sans-serif">`;
  [[0, 0], [180, 0], [0, 250], [180, 250]].forEach(([x, y]) => s += `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" fill="#000"/>`);
  s += `<rect x="-2.5" y="11.5" width="5" height="5" fill="#000"/>`;
  s += T(10, 4, 5, t.title.slice(0, 60), 'font-weight="700"');
  s += T(10, 13, 4.6, 'Name: ' + (name || '______________________________'), 'font-weight="700"');
  s += T(10, 20.5, 3.6, (cls.name + '   ·   Date: ____________   ·   Score: ______ / ' + t.n));
  s += T(10, 27, 3, 'Shade one circle fully for each number, using pencil or black pen. Erase cleanly. Do not write on the black squares.', 'fill="#333"');
  s += T(10, 33, 3, no ? 'Learner no. ' + no + ' — use only your own sheet.' : 'Extra sheet — your teacher will write your name in the app.', 'fill="#333"');
  s += T(10, 45, 2.6, 'For checking only:', 'fill="#666"');
  for(let k = 0; k < 12; k++){ const [x, y] = bitXY(k); const on = k < 7 ? (no >> k) & 1 : (t.code >> (k - 7)) & 1;
    s += on ? `<rect x="${x - 2.5}" y="${y - 2.5}" width="5" height="5" fill="#000"/>` : `<rect x="${x - 2.3}" y="${y - 2.3}" width="4.6" height="4.6" fill="none" stroke="#999" stroke-width="0.3"/>`; }
  s += `<line x1="8" y1="52" x2="172" y2="52" stroke="#bbb" stroke-width="0.3"/>`;
  for(let i = 0; i < t.n; i++){
    const [x0, y] = itemXY(i, 0);
    s += T(x0 - 4.5, y + 1.3, 3.6, String(i + 1), 'text-anchor="end" font-weight="700"');
    for(let j = 0; j < t.opts; j++){ const [x] = itemXY(i, j);
      s += `<circle cx="${x}" cy="${y}" r="${LAY.bubR}" fill="none" stroke="#000" stroke-width="0.3"/>` + T(x, y + 0.9, 2.5, LET[j], 'text-anchor="middle" fill="#9a9a9a"'); }
  }
  s += T(90, 247, 2.4, 'Checked with ' + CONFIG.appName, 'text-anchor="middle" fill="#888"');
  return s + '</svg>';
}
function printSheets(t){
  const cls = getClass(t.classId);
  const sheets = cls.learners.map((n, i) => sheetSVG(t, cls, i + 1)).concat([sheetSVG(t, cls, 0), sheetSVG(t, cls, 0)]).join('');
  const w = window.open('', '_blank'); if(!w){ toast('Please allow pop-ups so the sheets can open.'); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(t.title)} – answer sheets</title><style>@page{margin:8mm}body{margin:0}.sheet{display:block;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.note{font:14px Arial;padding:12px;background:#FFF6D6}@media print{.note{display:none}}</style></head><body><div class="note">${cls.learners.length} named sheets + 2 extra sheets. Print at 100% size (not "fit to page"). Any paper size: A4, short or long bond.</div>${sheets}</body></html>`);
  w.document.close(); setTimeout(() => { try{ w.focus(); w.print(); }catch(e){} }, 700);
}

// ---------- Excel files (CSV opens in Excel and Google Sheets) ----------
function downloadCsv(name, rows){
  const csv = rows.map(r => r.map(c => { const s = String(c == null ? '' : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Saved to your Downloads');
}
function csvItems(t){ const st = stats(t), c = getClass(t.classId);
  downloadCsv(t.title + ' item analysis', [['Test', t.title], ['Class', c.name], ['Learners checked', st.done], ['MPS', st.mps.toFixed(2) + '%'], ['Mean', st.mean.toFixed(2)], ['SD', st.sd.toFixed(2)], ['Highest', st.hi], ['Lowest', st.lo], [], ['Item', 'Key', 'Correct', 'Percent correct', 'Most chosen wrong answer', 'Level']]
    .concat(st.items.map(x => [x.i + 1, LET[t.key[x.i]], x.ok, x.pct.toFixed(1), x.top, LVL[x.lvl]]))); }
function csvScores(t){ const c = getClass(t.classId);
  downloadCsv(t.title + ' scores', [['Test', t.title], ['Class', c.name], ['Items', t.n], [], ['No.', 'LRN', 'Learner', 'Score', 'Percent'].concat(Array.from({ length: t.n }, (_, i) => 'Q' + (i + 1)))]
    .concat(c.learners.map((n, i) => { const r = t.results[i + 1]; return [i + 1, lrnCell(c, i), n, r ? r.score : '', r ? (r.score / t.n * 100).toFixed(1) : ''].concat(r ? r.ans.map(a => a == null ? '' : LET[a]) : []); }))); }

// ---------- backup ----------
function backup(){
  const data = { app: 'TestPaperFastChecker', v: 1, at: new Date().toISOString(), classes: S.classes.filter(c => !c.sample), tests: S.tests.filter(t => !t.sample), lastTerm: S.lastTerm };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = 'FastChecker-backup-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Backup saved to your Downloads');
}
async function restore(file){
  try{
    const d = JSON.parse(await file.text());
    if(d.app !== 'TestPaperFastChecker' || !Array.isArray(d.tests)) throw 0;
    const haveC = new Set(S.classes.map(c => c.id)), haveT = new Set(S.tests.map(t => t.id));
    d.classes.forEach(c => { if(!haveC.has(c.id)) S.classes.push(c); });
    let added = 0; d.tests.forEach(t => { if(!haveT.has(t.id)){ S.tests.push(t); added++; } });
    save(); go('home', {}, true); toast(added ? `Restored ${added} test${added === 1 ? '' : 's'} from the backup` : 'Everything in that backup is already on this phone');
  }catch(e){ toast('That file is not a FastChecker backup.'); }
}

// ---------- load code ----------
async function useCode(){
  const inp = $('#code'), err = $('#codeerr'), code = inp.value.trim().toUpperCase(); err.hidden = true;
  const fail = m => { err.textContent = m; err.hidden = false; };
  if(!/^SE-[0-9A-F]{10}-[0-9A-F]{8}-[0-9A-F]{6}$/.test(code)) return fail('That code does not look right. It starts with SE- and has 3 dashes. Please check for typos.');
  if((S.codes || []).some(c => c.code === code)) return fail('This code is already loaded on this phone.');
  if(navigator.onLine === false) return fail('You need internet once to load the code. Checking papers works offline after that.');
  try{
    const r = await fetch(CONFIG.verifyUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, device: DEVICE }) });
    const d = await r.json().catch(() => ({}));
    if(d.valid){
      S.codes = (S.codes || []).concat([{ code, papers: CONFIG.loadPapers, used: 0, at: Date.now(), exp: Date.now() + CONFIG.loadDays * 864e5 }]); save();
      toast(`Loaded! ${CONFIG.loadPapers} papers for ${CONFIG.loadDays} days.`); go('load', {}, true); }
    else fail(d.reason === 'expired' ? 'This code has expired.' : d.reason === 'devices' ? 'This code is already used on 2 phones. One code is for one teacher.' : d.reason === 'off' ? 'This code was turned off. Please message us.' : (d.error || 'That code was not accepted. Please check for typos.'));
  }catch(e){ fail('Could not reach the server. Please check your internet and try again.'); }
}

// ---------- sample class ----------
function makeSample(){
  const names = ['AQUINO, Mark Joseph', 'BAUTISTA, Carlo', 'CRUZ, Jerome', 'DIZON, Paolo', 'GARCIA, Kevin', 'MENDOZA, Ralph', '---', 'DELOS SANTOS, Angela', 'FLORES, Kristine', 'LOPEZ, Bea', 'NAVARRO, Jasmine', 'RAMOS, Patricia', 'TORRES, Nicole', 'VILLANUEVA, Hannah'].filter(n => n !== '---');
  const c = { id: uid(), name: 'Sample – Grade 8 Rizal', learners: names, lrn: names.map((_, i) => '4077261600' + String(10 + i)), sample: true }; S.classes.push(c);
  const rnd = (lo, hi) => String(Math.round(lo + Math.random() * (hi - lo)));
  c.extra = [{ id: uid(), title: 'Quiz 1', part: 'WW', hps: 20, term: 1, scores: {} }, { id: uid(), title: 'Quiz 2', part: 'WW', hps: 15, term: 1, scores: {} }, { id: uid(), title: 'PT 1 – Poster', part: 'PT', hps: 50, term: 1, scores: {} }, { id: uid(), title: 'PT 2 – Lab report', part: 'PT', hps: 40, term: 1, scores: {} }];
  names.forEach((_, i) => { c.extra[0].scores[i + 1] = rnd(11, 20); c.extra[1].scores[i + 1] = rnd(8, 15); c.extra[2].scores[i + 1] = rnd(32, 50); c.extra[3].scores[i + 1] = rnd(26, 40); });
  const n = 20, key = Array.from({ length: n }, () => Math.floor(Math.random() * 4));
  const t = { id: uid(), title: 'Sample Science Q1 Exam', classId: c.id, term: 1, part: 'QA', n, opts: 4, key, code: 7, results: {}, sample: true, at: Date.now() };
  const ease = Array.from({ length: n }, (_, i) => [0.92, 0.85, 0.4, 0.78, 0.3][i % 5]);
  names.forEach((nm, li) => { const skill = 0.75 + Math.random() * 0.4;
    const ans = key.map((k, i) => Math.random() < ease[i] * skill ? k : (k + 1 + Math.floor(Math.random() * 3)) % 4);
    t.results[li + 1] = { ans, score: scoreOf(t, ans), at: Date.now() }; });
  S.tests.push(t); save(); go('results', { id: t.id });
  toast('This is a sample. Delete it any time.');
}
